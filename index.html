        // Send performance data to analytics if available
        if (typeof gtag !== 'undefined') {
          gtag('event', 'timing_complete', {
            name: 'load',
            value: Math.round(perfData.loadEventEnd - perfData.loadEventStart)
          });
        }
      }

    // Hide loading screen when app is ready
    window.addEventListener('DOMContentLoaded', function() {
      const loading = document.getElementById('loading');
      const mainContent = document.getElementById('main-content');
      const seoFooter = document.getElementById('seo-footer');
      
      if (loading) loading.style.display = 'none';
      if (mainContent) mainContent.style.display = 'block';
      if (seoFooter) seoFooter.style.display = 'block';

    // SEO optimization: Track user engagement
    let startTime = Date.now();
    let hasScrolled = false;
    let hasClicked = false;
    
    // Track scroll depth
    window.addEventListener('scroll', function() {
      if (!hasScrolled) {
        hasScrolled = true;
        const scrollDepth = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
        console.log('User scrolled to:', scrollDepth + '%');
        
        if (typeof gtag !== 'undefined') {
          gtag('event', 'scroll_depth', {
            value: scrollDepth
          });
        }
      }
    });
    
    // Track clicks
    document.addEventListener('click', function() {
      if (!hasClicked) {
        hasClicked = true;
        const timeOnPage = Date.now() - startTime;
        console.log('User engaged after:', timeOnPage + 'ms');
        
        if (typeof gtag !== 'undefined') {
          gtag('event', 'user_engagement', {
            value: timeOnPage
          });
        }
      }
    });
    
    // Track time on page
    window.addEventListener('beforeunload', function() {
      const timeOnPage = Date.now() - startTime;
      console.log('Total time on page:', timeOnPage + 'ms');

        gtag('event', 'time_on_page', {
          value: timeOnPage
        });
      }
